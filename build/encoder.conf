# encoder.conf (local side-by-side copy: encoder_legacy_refactor.conf)
# Place this file in mpv's script-opts directory under the script's basename.

# General
keybind=e
output_directory=
output_template=%T-[%S-%E]
output_format=mp4
scale_height=-1
fps=-1
apply_current_filters=yes
downmix_audio=yes

# Optional child executable override. The script defaults to mpv.exe on
# Windows and mpv elsewhere.
# mpv_executable=C:\Program Files\mpv\mpv.exe

# UI
font_size=20
margin=20
message_duration=3

# MP4 / AVC or HEVC
video_codec_mp4=libx265
audio_codec_muxed=libopus
crf_mp4=28
target_size_mp4_mb=0
preset_avc=slow
preset_hevc=fast
tune_avc=
tune_hevc=
color_filter_8bit=format=yuv420p

# WebM / VP9 or AV1
video_codec_webm=libsvtav1
crf_webm=50
preset_av1=6
color_filter_10bit=format=yuv420p10le
target_size_av1_mb=0

# NVENC
video_codec_nvenc=av1_nvenc
cq_nvenc=30
cq_nvenc_av1=35
target_size_nvenc_mb=0

# Audio-only
audio_codec_audio=libopus
aac_bitrate=128000
opus_bitrate=96000
mp3_bitrate=192000

# Animated WebP
quality_webp=80
compression_level_webp=4

# Basket
video_codec_basket=libx264
target_size_basket_mb=4
basket_final_preset=veryslow
basket_first_pass_speed=4
basket_search_second_pass_speed=2
basket_final_second_pass_speed=0

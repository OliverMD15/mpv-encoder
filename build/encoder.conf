# encoder.conf
# Place this file in mpv's script-opts directory.
# Values below match the current encoder.lua defaults.

# General
keybind=e
output_directory=
output_template=%T-[%S-%E]
output_format=mp4
scale_height=-1
fps=-1

# Mutually exclusive with fps. vfr=yes removes duplicate frames while
# preserving variable timestamps.
vfr=no

# safe-only, inherit, or ignore
filter_policy=safe-only
downmix_audio=yes

# UI
font_size=20
margin=20
message_duration=3

# MP4 / AVC
video_codec_mp4=libx265
audio_codec_muxed=libopus
crf_mp4=28
# 0 = Off, 20 or 200 MB
target_size_mp4_mb=0

# AVC: medium, slow, slower, or veryslow
preset_avc=slow
# HEVC: fast, medium, slow, or slower
preset_hevc=fast
# AVC: empty, film, animation, or grain
tune_avc=
# HEVC: empty, animation, or grain
tune_hevc=
color_filter_8bit=format=yuv420p

# WebM / VP9 and AV1
video_codec_webm=libsvtav1
crf_webm=50
# AV1: 8, 6, or 4
preset_av1=6
color_filter_10bit=format=yuv420p10le
# 0 = Off, 20 or 200 MB
target_size_av1_mb=0

# NVENC
# h264_nvenc, hevc_nvenc, or av1_nvenc
video_codec_nvenc=av1_nvenc
cq_nvenc=30
cq_nvenc_av1=35

# Audio-only
# libopus, aac, or libmp3lame
audio_codec_audio=libopus
aac_bitrate=128000
opus_bitrate=96000
mp3_bitrate=192000

# Animated WebP
quality_webp=80
# 2 = Fast, 4 = Balanced, or 6 = Very Slow
compression_level_webp=4

# Basket
# libx264 or libvpx-vp9
video_codec_basket=libx264
target_size_basket_mb=4
basket_search_preset=medium
basket_final_preset=veryslow
basket_first_pass_speed=4
basket_search_second_pass_speed=2
basket_final_second_pass_speed=0
basket_final_attempts=2
basket_target_tolerance=0.95

# Legacy option names remain accepted for older encoder.conf files, but the
# canonical names above are recommended.
